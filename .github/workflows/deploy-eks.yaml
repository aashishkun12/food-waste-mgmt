name: deploy-on-eks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read 
env:
  POSTGRES_DB: food_waste_db
  POSTGRES_USER: test-user
  POSTGRES_PASSWORD: test-password
  ROLE_NAME: github-actions

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18.4
        env:
          POSTGRES_DB: food_waste_db
          POSTGRES_USER: test-user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:

      # 1. Get source code
      - uses: actions/checkout@v6

      # 2. Install Dependencies and Build
      # Frontend
      - name: setup-nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: build-frontend
        working-directory: frontend
        run: |
            npm ci
            npm run build

      # Backend
      - name: setup-java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      
      - name: build-backend
        working-directory: backend
        run: mvn -B -e clean verify -DtrimStackTrace=false
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{env.POSTGRES_DB}}
          SPRING_DATASOURCE_USERNAME: ${{env.POSTGRES_USER}}
          SPRING_DATASOURCE_PASSWORD: ${{env.POSTGRES_PASSWORD}}
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          JWT_SECRET: ci-only-jwt-secret
          JWT_EXPIRATION_MS: 86400000
      
      - name: upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

      # Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: "arn:aws:iam::501591550703:role/${{env.ROLE_NAME}}"
          aws-region: ap-south-1

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: false

      # Push to ECR
      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: foodwaste
          IMAGE_TAG_2: backend-${{ github.sha }}
          IMAGE_TAG_1: frontend-${{ github.sha }}
        run: |
          docker compose build
          docker compose push

      # Connect to EKS
      - name: update kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region ap-south-1 \
          --name foodwaste_eks_cluster
        
      - run: kubectl get nodes

      # Deploy iamge
      - name: Deploy new images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl set image deployment/frontend-deployment \
          frontend=$REGISTRY/foodwaste:frontend-${GITHUB_SHA}

          kubectl set image deployment/backend-deploy \
          backend=$REGISTRY/foodwaste:backend-${GITHUB_SHA}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/frontend-deployment
          kubectl rollout status deployment/backend-deploy
