services:
  db:
    image: postgres:18.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - data:/var/lib/postgresql

  backend-service:
      build: ./backend
      image: ${BACKEND_IMAGE}
      ports:
        - "8080:8080"
      depends_on:
        - db

  frontend-service:
    build: ./frontend
    image: ${FRONTEND_IMAGE}
    ports:
      - "80:5173"
    depends_on:
      - backend-service

volumes:
  data: